const FLAGS={
AZ:['Hazırkı bayraq 1918-də Xalq Cümhuriyyəti dövründə qəbul edilib, sovet illərində qırmızı bayraq işlənib, 1991-də isə üçrəngli bayraq bərpa olunub.','Rənglərin izahı belədir: mavi türk kimliyini, qırmızı müasirləşməni və inkişafı, yaşıl İslam mədəniyyətini bildirir.','Ağ aypara və səkkizguşəli ulduz mərkəzdədir. Səkkiz guşə çox vaxt türk xalqlarının qruplarına işarə kimi izah olunur.'],
TR:['Aypara və ulduz Osmanlı bayrağından qalıb. Qırmızı fonun qanla bağlı rəvayətləri var, amma 1936-cı il Bayraq Qanunu yalnız ölçüləri və həndəsəni dəqiq müəyyən edir, rənglərin mənasını yox.','Məşhur rəvayətə görə, döyüşdən sonra göldə qan və səmadakı ay-ulduz əks olunub. Bu tarixi sənədlə təsdiqlənmiş fakt deyil, xalq rəvayətidir.','Osmanlı dövründə qırmızı fonda ay-ulduz bayrağı 1844-də standartlaşdırılıb, sonrakı bayraq həmin sxemdən inkişaf edib.'],
GE:['Bayraq “beşxaçlı” adlanır: ortada böyük Müqəddəs Georgi xaçı, künclərdə isə dörd kiçik xaç var.','Bu bayraq orta əsrlərdən tanınırdı, 2004-cü ildə Gül inqilabından sonra dövlət bayrağı oldu. Ondan əvvəl 1990-cı illərdə tünd qırmızı, qara və ağ rəngli bayraq işlənirdi.','1918–1921-ci illərdəki Demokratik Respublikanın da tünd qırmızı-qara-ağ bayrağı olub.'],
JP:['Bayrağın adı “Hinomaru”dur, yəni “günəş dairəsi”. Yaponiya sözü “günəşin mənbəyi” mənasına gəlir.','Hinomaru 1870-ci ildə ticarət gəmiləri üçün bayraq kimi təsdiqlənib, lakin milli bayraq kimi qanuni statusu yalnız 1999-cu ildə verilib.','Qırmızı dairə mərkəzdə yerləşir və bayrağın dizaynı dünyada ən sadələrdən biridir.'],
FR:['Üçrəngli bayraq 1789 inqilabı zamanı yaranıb: mavi və qırmızı Parisin rəngləri, ağ isə kral (Burbon) rəngi hesab olunur.','Zolaqların şaquli düzülüşü 1794-cü ildə Konvent tərəfindən təsdiqlənib. Sonradan yayılan “azadlıq, bərabərlik, qardaşlıq” izahı isə yaranma səbəbi deyil, sonrakı təfsirdir.','1830-cu il inqilabından sonra Burbon ağ bayrağı ləğv edilib və trikolor bərpa olunub.'],
DE:['Qara-qırmızı-qızılı rənglər Napoleon əleyhinə döyüşən Lützow könüllülərinin formasından (qara forma, qırmızı yaxalıq, qızılı düymə) götürülüb.','1848-ci ildə Frankfurt Parlamenti bu bayrağı birləşmiş Almaniya bayrağı kimi seçib, 1949-dan Əsas Qanunun 22-ci maddəsi ilə rəsmidir.','Şərqi Almaniya 1959-dan həmin bayrağa çəkic və pərgar gerbi əlavə edib; 1990-da bayraq yenidən yalnız zolaqlardan ibarət oldu.'],
BR:['Yaşıl və sarı rənglərin ilkin mənası sülalələrlə bağlıdır: yaşıl Braqança, sarı isə Habsburq evini təmsil edib. Sonradan işlənən “meşə və qızıl” izahı daha populyardır.','Mavi dairədəki ulduzlar 15 noyabr 1889-da Rio-de-Janeyro səmasının görünüşünü əks etdirir, hər ulduz bir ştata uyğundur.','“Ordem e Progresso” şüarı Ogüst Kontun pozitivizm fəlsəfəsindən gəlir.'],
CA:['Ağcaqayın yarpağı bayrağı 1965-ci ildə qəbul edilib. Əvvəl Britaniya bayrağı olan “Red Ensign” işlənirdi və qəbul çox qızğın müzakirə ilə keçib.','Qırmızı və ağ rəngləri Kral V Corc 1921-də Kanadanın rəsmi rəngləri elan edib.','Yarpağın 11 uc nöqtəsi var, amma bu sayın əyalət və ya digər rəmzlə bağlılığı yoxdur.'],
US:['13 zolaq ilk 13 koloniyanı, 50 ulduz isə 50 ştatı bildirir. Ulduzların sayı ştatlarla birlikdə artıb.','Hazırkı 50 ulduzlu bayraq 1960-cı ildə qəbul edilib. Dizaynı məktəb layihəsi kimi hazırlayan 17 yaşlı Robert Heft-in variantı seçilib.','Rənglərin mənası bayraq üçün deyil, 1782-ci il Dövlət Möhürü üçün Çarlz Tomson tərəfindən izah edilib: ağ təmizlik, qırmızı cəsarət, mavi ayıqlıq.'],
EG:['Qırmızı-ağ-qara rənglər ərəb dünyasının ümumi (Pan-Ərəb) rəngləri sırasındadır və 1952 inqilabı ilə bağlı bayraqda istifadə olunub.','Ortadakı qızıl qartal Səlahəddin qartalıdır və 1984-dən bayraqdadır. Əvvəlki dövrlərdə bu yerdə başqa qartal (Qüreyş şahini) olub.','Qırmızı adətən mübarizəni, ağ parlaq gələcəyi, qara isə zülmün sonunu ifadə edir. Bu izah rəsmi hüquqi tərif deyil, geniş yayılmış təfsirdir.'],
IN:['Bayrağı 1921-ci ildə Pinqali Venkayya təklif edib; ortada əvvəlcə Qandinin təklif etdiyi əyirmə çarxı var idi, 1947-də isə onu Aşoka çarxı əvəz etdi.','Aşoka çarxı 24 dilimlidir və Sarnathdakı Aşoka sütunundan götürülüb. Bayraq 22 iyul 1947-də qəbul edilib.','Za’fəran rəngi cəsarət və fədakarlığı, ağ həqiqət və sülhü, yaşıl inam və bərəkəti bildirir. Bu izahı Sarvepalli Radhakrişnan verib.'],
AU:['Sol küncdə Böyük Britaniya bayrağı, altında yeddiguşəli Federasiya ulduzu (altı ştat və əraziləri), sağda isə Cənub Xaçı bürcü var.','Dizayn 1901-də ümumxalq müsabiqəsi ilə seçilib, iştirakçı sayı 32 mindən çox olub.','Aborigen və Torres boğazı bayraqları 1995-ci ildən ayrıca rəsmi bayraq statusuna malikdir.'],
IT:['Yaşıl-ağ-qırmızı bayraq 1797-ci ildə Reggio Emiliyada Sispadan Respublikası tərəfindən qəbul edilib, Napoleon dövrünün təsiri ilə.','Rənglərin “çəmən, qar və qan” izahı sonradan yayılıb və rəsmi deyil.','Bayraq Meksika bayrağına çox bənzəyir, fərq Meksikada ortadakı qartal gerbinin olmasıdır. 7 yanvar isə “Trikolor günü” kimi qeyd olunur.'],
RU:['Ağ-mavi-qırmızı rənglər çar I Pyotrun 1699-cu ildə gəmilər üçün seçdiyi rənglərdən gəlir. Sovet dövründə qırmızı bayraq işlədilib, 1991-də isə trikolor qaytarılıb.','Rənglərin rəsmi mənası qanunda yoxdur; ağ zadəganlıq, mavi sədaqət, qırmızı cəsarət kimi izahlar populyardır.','Eyni rənglər Slovakiya, Sloveniya və Serbiyanın bayraqlarında da var. Niderland bayrağı isə eyni rənglərin başqa ardıcıllığıdır.'],
MX:['Ortadakı qartal gerbi Tenoçtitlan əfsanəsindən gəlir: qartal kaktus üstündə ilan tutub.','1821-də yaşıl, ağ, qırmızı “Üç Zəmanət Ordusu”nun rəngləri idi: müstəqillik, din və birlik. Sonradan mənalar dəyişib və rəsmi izah bu gün sabit deyil.','Bayraq İtaliya bayrağına oxşayır, fərq gerb və ölçü nisbətindədir.'],
AR:['Bayrağı 1812-ci ildə Manuel Belqrano Rosarioda yaradıb. Bayraq Günü onun vəfat tarixi olan 20 iyunda qeyd olunur.','Ortadakı “May Günəşi” 1818-də əlavə olunub və 1810-cu il May inqilabını simvolizə edir. Günəşin 32 şüası var.','Mavi və ağ rənglərin Belqranonun seçiminin səbəbi ilə bağlı bir neçə izah var, dəqiq tarixi səbəb birmənalı deyil.'],
ZA:['Bayraq 27 aprel 1994-də ilk demokratik seçki günü qəbul edilib və Frederik Braunell tərəfindən hazırlanıb.','“Y” forması müxtəlif yolların birləşməsini bildirir. Rənglərin ayrıca rəsmi mənası açıqlanmayıb, ona görə də ümumi izah uyğunlaşmanı vurğulayır.','Apartheid dövründəki bayraq narıncı-ağ-mavi idi və Hollandiya kökündən gəlirdi. Yeni bayraq altı rəngli olduğu üçün ölkənin ən rəngarəng bayraqlarındandır.'],
CN:['Bayraq 1949-cu ildə açıq müsabiqə ilə seçilib (2992 layihə), müəllifi Zeng Lianson göstərilir.','Böyük ulduz Kommunist Partiyasını, dörd kiçik ulduz isə sosial təbəqələri (fəhlə, kəndli, xırda burjuvaziya, milli burjuaziya) simvolizə edir.','Qırmızı fon inqilabı bildirir. Bayraq 1 oktyabr 1949-da Tiananmen meydanında ilk dəfə qaldırılıb.'],
ES:['1785-ci ildə Kral III Karlos qırmızı-sarı-qırmızı bayrağı dənizdə ağ Burbon bayraqları ilə qarışmasın deyə seçib.','Respublika illərində (1931–1939) bayraqda sarı ilə birlikdə bənövşəyi zolaq işlənib.','Sol tərəfdəki gerbdə “Herkules sütunları” və “Plus Ultra” devizi var.'],
AM:['Qırmızı-mavi-narıncı bayraq 1918–1922-ci illərdə işlənib, 1990-da bərpa olunub və 2006-cı ildə ayrıca qanunla tənzimlənib.','Ermənistanda adətən qırmızı mübarizəni, mavi sülh səmasını, narıncı isə əməksevərliyi bildirən kimi izah edilir; bu izah rəsmi mətnlərdə də işlənir.','Narıncı rəngin ərik və ölkənin təbiəti ilə əlaqələndirilməsi də var, amma bu əlavə təfsirdir.'],
IR:['Yaşıl-ağ-qırmızı zolaqlar İslam inqilabından əvvəl də var idi, yalnız 1980-də ortadakı Şir və Günəş rəmzi yenidən dizayn olunmuş emblemlə əvəz edilib.','Zolaqların sərhədində “Allahu Əkbər” ifadəsi 22 dəfə yazılıb; 22 rəqəmi inqilabın günü olan 22 Bəhmən ilə bağlıdır.','Ortadakı emblem stilizə olunmuş “Allah” sözündən ibarətdir.'],
UA:['Sarı-mavi rənglərin ən populyar izahı buğda zəmisi və səmadır; bu, rəsmi hüquqi tərif deyil.','Rənglər 1848-ci ildə Lvovda Ruteniya Baş Şurasının istifadəsində olub və Ukraynanın bayrağı 1992-də təsdiqlənib.','Bayraq Sovet dövründə qadağan edilmişdi, 1991-də yenidən qaldırıldı.'],
KZ:['Bayraq səmayı mavi fondadır. Bu rəng türk xalqlarında səmanı, sonsuzluğu və Göy Tanrını xatırladır.','Ortadakı günəşin 32 şüası və altındakı bozqır qartalı azadlığı və ucalığı təmsil edir.','Sol tərəfdəki naxış “qoç buynuzu” ornamentidir və bayraq dizaynı Şəkən Niyazbekov tərəfindən hazırlanıb (1992).'],
UZ:['Bayraq 18 noyabr 1991-də qəbul edilib. Mavi rəng Əmir Teymur dövlətinin bayraq rəngi ilə əlaqələndirilir.','Aypara yeni doğan ayı, 12 ulduz isə ilin 12 ayını (bəzi izahlarda 12 bürcü) bildirir.','Qırmızı incə zolaqlar həyat qüvvəsi kimi izah olunur. Bu izahlar rəsmi rəmzi mənadır, tarixi mənbə ilə yalnız qismən bağlıdır.'],
PK:['Bayrağın müəllifi Seyid Əmir Üddin Kidvai sayılır və Müəssislər Məclisi onu 11 avqust 1947-də qəbul edib.','Yaşıl əsas hissə müsəlman çoxluğu, ağ zolaq dini azlıqları təmsil edir. Aypara tərəqqini, ulduz isə bilik və işığı bildirir.','Bayraq Müsəlman Liqasının bayrağından təsirlənib.'],
SA:['Bayrağın üzərində şəhadət kəlməsi yazılıb, buna görə bayraq heç vaxt yarıya endirilmir.','Qılıncın ədaləti və gücü simvolizə etməsi ilə bağlı izahlar var. Bayraq iki üzü oxunaqlı olsun deyə xüsusi tikilir.','Yaşıl rəng İslam ilə əlaqələndirilir. Müasir formaya yaxın bayraq 1973-dən işlənir.'],
GB:['Bayraq 1606-cı ildə İngiltərənin Müqəddəs Georgi və Şotlandiyanın Müqəddəs Andrey xaçlarının birləşməsindən yaranıb, 1801-də İrlandiyanın Müqəddəs Patrik xaçı əlavə olunub.','Uelsin ayrıca rəmzi bayraqda yoxdur, çünki bayraq yaranan zaman Uels İngiltərənin tərkibində sayılırdı.','Diaqonal xaçlar simmetrik deyil, ona görə bayraq tərs asılarsa fərqi görünür.'],
PL:['Ağ və qırmızı Polşanın gerbindəki qırmızı fonda ağ qartaldan gəlir. Rənglər 1831-ci ildən milli rəng kimi qəbul olunub, qanuni təsdiq 1919-dadır.','Bayraq İndoneziya bayrağının tərsidir, Monako bayrağı ilə də çox oxşardır.','2 may Polşada Bayraq Günüdür.'],
GR:['Mavi-ağ zolaqlar Yunanıstan bayrağını ağ xaçla birləşdirir, 9 zolaq isə xalq arasında “Eleftheria i Thanatos” (Azadlıq ya ölüm) ifadəsinin 9 hecası ilə əlaqələndirilir. Bu izah rəsmi deyil.','Bayraq 1822-ci ildə Epidavr Milli Məclisində təsdiqlənib, mavi rəngin bugünkü tonu isə 1978-də qəbul olunub.','Ağ xaç Yunan Pravoslav kilsəsi ilə bağlıdır.'],
NL:['Bayrağın əvvəlki versiyası narıncı-ağ-mavi idi (Orange Şahzadəsinin bayrağı), 17-ci əsrdə narıncı qırmızıya keçib. Çünki qırmızı dənizdə daha yaxşı seçilirdi (şərh olunan bir izahdır).','Rəsmi olaraq 1937-də kral fərmanı ilə təsdiqlənib.','Bayraq Rusiya bayrağının tərs rənglərindən ibarətdir, Lüksemburq bayrağı isə açıq mavi zolağı ilə fərqlənir.'],
CH:['İsveçrə və Vatikan bayrağı dünyada kvadrat formalı yeganə suveren dövlət bayraqlarıdır.','Qırmızı fonda ağ xaç var. Beynəlxalq Qırmızı Xaç rəmzi bu bayrağın rənglərinin tərsi kimi yaradılıb (Henri Dünan İsveçrəlidir).','Bayrağın nisbəti 1889-da federal qərarla müəyyən olunub.'],
KR:['Bayrağın adı Taequkgi-dir. Ağ fon saflığı, qırmızı-mavi dairə (Taeguk) kainatın tarazlığını bildirir.','Dörd trigram səma, yer, su və oddur.','Layihənin 1882-ci ildə diplomat Pak Yonhyo tərəfindən hazırlandığı deyilir; rəsmi bayraq 1948-də qəbul olunub.'],
ID:['Qırmızı-ağ bayrağın adı “Merah Putih”dir. Qırmızı cəsarəti, ağ isə saflığı bildirir; rənglər Mecapahit dövrü ilə də əlaqələndirilir.','Bayraq 17 avqust 1945-də müstəqillik elanında qaldırılıb. Fatmavati tərəfindən tikilmiş original “Bendera Pusaka” adlanır.','Monako bayrağı ilə demək olar ki, eynidir, yalnız nisbət fərqlidir.'],
NG:['Bayrağı 1959-cu ildə keçirilən müsabiqədə tələbə Taivo Akinkunmi hazırlayıb. Layihədə əvvəlcə qırmızı günəş də var idi, sonra çıxarılıb.','Yaşıl kənd təsərrüfatı və təbii sərvətləri, ağ isə sülhü bildirir.','Bayraq 1 oktyabr 1960-da müstəqillik günü qaldırılıb.'],
KE:['Bayraqdakı Masai qalxanı və iki nizə müdafiəni və azadlığı simvolizə edir.','Qara xalqı, qırmızı azadlıq mübarizəsinin qanını, yaşıl torpağı bildirir; ağ zolaqlar sülhü.','Bayraq KANU partiyasının bayrağından götürülüb və 12 dekabr 1963-də qəbul olunub.'],
TM:['Solda şaquli xalça zolağında beş əsas tayfanın (Teke, Yomut, Ərsari, Çovdur, Saryk) xalça naxışları var.','Aypara və beş ulduz beş vilayəti simvolizə edir. Zeytun budaqları 2001-də bitərəflik simvolu kimi əlavə edilib.','Bayraq 1997-də qəbul edilib və dünyanın ən mürəkkəb bayraqlarından biri sayılır.'],
NZ:['Cənub Xaçının dörd qırmızı ulduzu bayrağın əsas fərqləndirici hissəsidir; Avstraliya bayrağında ulduzlar ağ və sayları fərqlidir.','Bayraq 1902-ci ildə qanunla təsdiqlənib.','2015–2016-cı illərdə referendum keçirilib, seçicilərin əksəriyyəti (təxminən 57%) köhnə bayrağı saxlamağa səs verib.'],
BY:['Bayraq 1995-ci il referendumundan sonra qəbul edilib və sovet dövrü bayrağının qırmızı-yaşıl sxemindən təsirlənib.','Solda ağ-qırmızı ornament ənənəvi Belarus dəsmalı (rushnyk) naxışıdır və 1917-ci il nümunəsinə əsaslanır.','Ağ-qırmızı-ağ bayraq 1918-ci il Belarus Xalq Respublikasından qalıb və bu gün müxalifət tərəfindən də istifadə olunur.'],
MD:['Mavi-sarı-qırmızı şaquli zolaqlar Rumıniya bayrağına çox bənzəyir; fərq ortadakı gerbdir.','Gerbdə Moldova knyazlığının rəmzi olan zubr başı təsvir olunub.','Bayraq 1990-cı ildə, SSRİ-nin dağılmasından əvvəl qəbul edilib.'],
FI:['Bayraq mavi xaçlı ağ fondur. Ağ qarı, mavi isə göl və səmanı xatırladır; bu populyar izah rəsmi tərif deyil.','Müasir bayraq 1918-ci ildə, müstəqillikdən dərhal sonra qəbul edilib.','Xaç Skandinaviya (Şimal) xaçı ailəsinə aiddir.'],
SE:['Mavi fonda sarı xaç 16-cı əsrdən işlənir; qanuni tənzimləmə 1906-cı ildə edilib.','Rəvayətə görə, 1157-ci ildə Kral IX Erik səmada qızılı xaç görüb. Bu tarixi sənədlə sübut olunmayıb, rəvayətdir.','Şimal xaçı Danimarka və Norveç bayraqlarında da var.'],
NO:['Bayraq 1821-ci ildə qəbul edilib. Danimarka bayrağından xaçı götürüb, mavi xaç əlavə edib.','Qırmızı-ağ-mavi rənglər Fransa trikoloru və digər Qərb bayraqlarından təsirlənib.','Müəllifi Fredrik Meltser sayılır.'],
DK:['Danneborq dünyada fasiləsiz istifadə olunan ən qədim milli bayraqlardan biridir.','Rəvayətə görə, 1219-cu ildə Lindanise döyüşündə bayraq səmadan düşüb. Bu sübut olunmayan rəvayətdir.','15 iyun “Valdemar günü” Bayraq Günü kimi qeyd olunur.'],
AT:['Rəvayətə görə, Hersoq V Leopold 1191-ci ildə Akra döyüşündə qanlı geyimdən kəməri çıxaranda ağ zolaq qalıb. Bu rəvayətdir.','Qırmızı-ağ-qırmızı rənglər Babenberq sülaləsinin rəngləridir.','Latviya bayrağına oxşayır, fərq Latviyanın daha tünd qırmızı və nazik ağ zolağıdır.'],
BE:['Qara-sarı-qırmızı rənglər 1830-cu il inqilabı zamanı Brabant hersoqluğunun rənglərindən götürülüb.','Bayraq şaquli zolaqlıdır. Almaniya bayrağının rəngləri oxşardır, lakin zolaqlar üfüqi və ardıcıllıq fərqlidir.','Bayraq 1831-ci il konstitusiyası ilə təsdiqlənib.'],
IE:['Yaşıl-ağ-narıncı bayraq 1848-ci ildə Tomas Frensis Mihar tərəfindən Fransa trikoloru nümunəsində təqdim edilib.','Ağ zolaq yaşıl (kelt-katolik) və narıncı (protestant) icmalar arasında sülhü bildirir; bu populyar təfsirdir.','1916-cı il Pasxa üsyanından sonra geniş yayılıb, 1937-ci il konstitusiyası ilə rəsmiləşib.'],
LT:['Sarı-yaşıl-qırmızı bayraq 1918-də qəbul edilib, sovet dövründə qadağan olunub, 1988–1989-da yenidən qaldırılıb.','Sarı günəş və buğdanı, yaşıl təbiəti, qırmızı isə qanı bildirir; bu populyar izahdır.','Bayraq 1988-də Ali Sovet tərəfindən yenidən dövlət bayrağı kimi tanınıb.'],
LV:['Tünd qırmızı rəng “Latviya qırmızısı” adlanır. Rəvayətə görə, bayraq 1279-cu ildə yaralı latış rəhbərinin ağ çarşafa bükülməsindən yaranıb.','Bayraq 1918-də qəbul edilib, sovet dövründə qadağan olunub və 1990-da bərpa olunub.','Avstriya bayrağına oxşayır, fərq qırmızı rəngin tonu və nisbətdir.']
